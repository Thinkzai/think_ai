name: Thinkz AI ECR Publish & Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_run:
    workflows: ["Thinkz AI CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: thinkz-prod-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: thinkz-prod-api

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::661609780373:role/ThinkzAI-GitHub-ECR-Push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${SHA}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Image URI: ${IMAGE_URI}"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.image_uri }}

      - name: Deploy to AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$EC2_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            "${EC2_USER}@${EC2_HOST}" \
            "/home/ubuntu/scripts/deploy.sh '${IMAGE_URI}'"
