limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
include /etc/nginx/runtime/backend-active.conf;
server {
    listen 80;
    server_name _;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;
location ~* \.(php|asp|aspx|cgi)$ {
    return 404;
}

location ~* /(wp-admin|wp-content|wp-includes|manager|boaform|setup\.cgi|shell) {
    return 404;
}
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://thinkz_backend_active/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://thinkz_backend_active/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
