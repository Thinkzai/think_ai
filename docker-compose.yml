services:
  postgres:
    image: postgres:16-alpine
    container_name: thinkz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: thinkz_ai
      POSTGRES_USER: thinkz_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkz_user -d thinkz_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: thinkz_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
    container_name: thinkz_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
